[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastro"
version = "0.1.0"
description = "Long/cash spot crypto allocator with a verifiable research laboratory."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Caue Bertolino" }]
dependencies = [
    "duckdb==1.5.6",
    "pyarrow==26.0.0",
    "httpx==0.28.1",
    "typer==0.27.3",
    "click==8.5.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
lastro = "lastro.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["lastro*"]

[tool.setuptools.package-data]
"lastro.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
